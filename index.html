<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08070c">
  <title>Mystery 001 — Les Trois Portes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="landing">
  <main class="shell center">
    <div class="sigil">M·001</div>
    <p class="eyebrow">DOSSIER CLASSÉ</p>
    <h1>LES TROIS<br><span>PORTES</span></h1>
    <p class="intro">Trois téléphones. Trois indices différents.<br>Une seule équipe.</p>

    <section class="panel setup">
      <label for="team">Nom de votre équipe</label>
      <input id="team" maxlength="20" placeholder="Ex. Les Ombres">
      <button id="createBtn" class="primary">ENTRER DANS LE MYSTÈRE</button>
      <p class="hint">Après création, partagez le code d'équipe aux deux autres joueuses.</p>
    </section>

    <section class="panel join">
      <label for="joinCode">Vous avez déjà un code ?</label>
      <input id="joinCode" maxlength="12" placeholder="CODE">
      <button id="joinBtn" class="secondary">REJOINDRE L'ÉQUIPE</button>
    </section>

    <p id="status" class="status"></p>
  </main>
  <script src="game.js"></script>
</body>
</html>
